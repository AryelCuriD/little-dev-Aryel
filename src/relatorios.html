<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relatórios - Little Dev</title>
  
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="relatorios.css" />
</head>
<body>

  <!-- HEADER PADRÃO -->
  <div class="container">
    <div class="top-row">
      <div class="div-tabela"></div>
      <div class="div-informacao"></div>
    </div>
    <div class="div-paginas">
      <div class="paginas-grid"></div>
    </div>
  </div>

  <!-- CONTEÚDO -->
  <main class="container-relatorios">

    <!-- TABELA DE DEVOLUÇÕES -->
    <section class="tabela-reservas">
      <div class="header-tabela">
        <h2>Devoluções de Chave</h2>
        <button id="btn-criar-devolucao" class="btn-criar">+ Criar Devolução</button>
      </div>

      <div class="tabela-container">
        <table id="tabela-devolucoes">
          <thead>
            <tr>
              <th>ID</th>
              <th>Sala</th>
              <th>Solicitante</th>
              <th>Data</th>
              <th>Período</th>
              <th>Estojo</th>
              <th>Observação</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <p id="sem-dados" class="sem-dados">
        Nenhuma devolução registrada.
      </p>
    </section>

    <!-- FILTRO + GERAR PDF -->
    <aside class="filtro-relatorio">
      <h3>Filtrar e Gerar Relatório</h3>

      <div class="form-group">
        <label>Data Inicial</label>
        <input type="date" id="filtro-data-inicio">
      </div>
      <div class="form-group">
        <label>Data Final</label>
        <input type="date" id="filtro-data-fim">
      </div>
      <div class="form-group">
        <label>Sala</label>
        <select id="filtro-sala">
          <option value="">Carregando salas...</option>
        </select>
      </div>

      <div class="form-group buttons">
        <button id="btn-aplicar-filtro" class="btn-aplicar">Aplicar Filtro</button>
        <button id="btn-limpar-filtro" class="btn-limpar">Limpar</button>
      </div>

      <div class="form-group pdf-section">
        <button id="btn-baixar-relatorio" class="btn-baixar">
          Baixar Relatório PDF
        </button>
        <p id="erro-filtro" class="erro-filtro">
          Selecione um intervalo válido.
        </p>
      </div>
    </aside>

  </main>

  <!-- MODAL: CRIAR DEVOLUÇÃO -->
  <div id="modal-criar-devolucao" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModalDevolucao()">x</span>
      <h3>Criar Devolução de Chave</h3>

      <div class="form-group">
        <label>Reserva Concluída</label>
        <select id="select-reserva" required>
          <option value="">Carregando...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Estojo</label>
        <div class="radio-group">
          <label><input type="radio" name="estojo" value="completo" checked> Completo</label>
          <label><input type="radio" name="estojo" value="incompleto"> Incompleto</label>
        </div>
      </div>

      <div class="form-group">
        <label>Observação (opcional)</label>
        <textarea id="observacao" rows="3" placeholder="Ex: faltando canetas de quadro"></textarea>
      </div>

      <button id="btn-salvar-devolucao" class="btn-salvar">Salvar Devolução</button>
    </div>
  </div>

  <!-- FOOTER PADRÃO -->
  <footer>
    <div class="logo-area">
      <img src="imgs/Logos - Sistema Fiep RGB_BRANCO_SENAI.png" alt="Logo SENAI">
    </div>
    <nav class="paginas">
      <a href="/" data-page="home">Página Inicial</a> |
      <a href="/reservas" data-page="reservas">Reservas</a> |
      <a href="/relatorios" data-page="relatorios">Relatórios</a>
    </nav>
    <div class="icons">
      <img src="imgs/bell.png" alt="Notificações" onclick="abrirNotificacoes()">
      <img src="imgs/user.png" alt="Usuário" onclick="paginaUsuario()">
    </div>
  </footer>

  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- SEU SCRIPT -->
  <script type="module" src="relatorios.js"></script>

</body>
</html>
